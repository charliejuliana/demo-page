<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Styled Website</title>
    <style>
        /* 1. Root Variables - A pro trick to manage colors in one place! */
        :root {
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --primary-blue: #3498db;
            --dark-blue: #2c3e50;
            --text-grey: #5a67d8; /* Slightly more colorful grey */
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 20px; /* Slightly rounder for a friendlier look */
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05); /* Softer shadow */
            max-width: 450px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        /* Subtle animation when someone lands on your page */
        .container:hover {
            transform: translateY(-5px);
        }

        h1 {
            color: var(--dark-blue);
            margin-bottom: 15px;
            font-size: 1.8rem;
        }

        p {
            line-height: 1.8; /* More space between lines for readability */
            font-size: 1.05rem;
            color: #4a5568;
            margin-bottom: 20px;
        }

        .profile-image {
            width: 100%;
            max-width: 350px;
            height: auto;
            border-radius: 12px;
            margin: 10px 0 25px 0;
            border: 4px solid var(--bg-color);
        }

        .favorite-link {
            display: inline-block;
            padding: 12px 28px;
            background-color: var(--primary-blue);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .favorite-link:hover {
            background-color: #2980b9;
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3);
        }

        /* Adds a "pressed" effect when clicked */
        .favorite-link:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <main class="container">
        <h1>Welcome to Our Coding Class</h1>
        
        <p>
            This website is officially live on GitHub Pages! 
            I have learned how to structure content with HTML, 
            style it with CSS, and host it for the world to see.
        </p>

        <img src="download.jpeg" alt="six seven kid" class="profile-image">

        <p>Ready to explore more?</p>
        
        <a href="https://six-seven.net/" target="_blank" class="favorite-link">
            Visit My Favorite Site
        </a>
    </main>

</body>
</html>
