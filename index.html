<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Styled Website</title>
    <style>
        /* CSS: This part handles the "Look" */
        body {
            background-color: #f0f4f8; /* Light blue-grey background */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            text-align: center;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }

        p {
            line-height: 1.6;
            font-size: 1.1rem;
            color: #555;
        }

        .profile-image {
            width: 100%;       /* Fills the container width */
            max-width: 400px;  /* Stops it from getting too big */
            height: auto;      /* Keeps the proportions correct */
            border-radius: 8px;
            margin-top: 20px;
            border: 5px solid #f0f4f8; /* Adds a nice little border around the photo */
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome to Our Coding Class</h1>
        
        <p>
            This website is officially live on GitHub Pages! 
            I have learned how to structure content with HTML, 
            style it with CSS, and host it for the world to see.
        </p>

        <img src="download.jpeg" alt="six seven kid" class="profile-image">
    </div>

</body>
</html>
